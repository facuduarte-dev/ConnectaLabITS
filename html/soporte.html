<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | DevConnect</title>

    <link rel="stylesheet" href="contacto.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Iconos -->
    <link rel="stylesheet"
        href="../css/soporte.css">
</head>

<body>

    

    <section class="contacto">

        <span class="etiqueta">
            <i class="fa-solid fa-headset"></i>
            ESTAMOS PARA AYUDARTE
        </span>

        <h1>Contacta con soporte</h1>

        <p class="descripcion">
            ¿Tienes dudas, problemas o sugerencias?<br>
            Nuestro equipo está listo para ayudarte.
        </p>

        <form class="formulario">

            <div class="grupo">

                <div class="icono">
                    <i class="fa-regular fa-envelope"></i>
                </div>

                <div class="contenido">

                    <label>¿En que te podemos ayudar?</label>

                    <small>Cuéntanos en que podemos ayudarte.</small>

                    <input placeholder="" type="text">

                </div>

            </div>


            <div class="grupo">

                <div class="icono">
                    <i class="fa-regular fa-file-lines"></i>
                </div>

                <div class="contenido">

                    <label>Describe tu consulta</label>

                    <small>Cuéntanos más detalles sobre tu consulta o tu problema.</small>

                    <textarea
                        placeholder="Escribe tu mensaje aquí..."></textarea>

                </div>

            </div>


            <div class="grupo">

                <div class="icono">
                    <i class="fa-solid fa-at"></i>
                </div>

                <div class="contenido">

                    <label>Correo electrónico</label>

                    <small>Te responderemos a este correo.</small>

                    <input
                        type="email"
                        placeholder="ejemplo@correo.com">

                </div>

            </div>

        </form>

        <button class="btn">
            <i class="fa-regular fa-paper-plane"></i>
            Enviar un mensaje
        </button>

        <p class="seguridad">
            <i class="fa-regular fa-circle-check"></i>
            Tu información está segura con nosotros
        </p>

    </section>

</body>

</html>
